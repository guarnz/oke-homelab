name: Validate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: Which validation to run
        type: choice
        default: all
        options:
          - all
          - lint
          - resources
          - charts
          - terraform
          - scripts
          - actionlint
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      resources: ${{ steps.filter.outputs.resources }}
      upstream: ${{ steps.filter.outputs.upstream }}
      terraform: ${{ steps.filter.outputs.terraform }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            resources:
              - 'gitops/**/resources/**'
              - 'gitops/global-values.yaml'
            upstream:
              - 'gitops/apps/**'
              - 'gitops/config/**/values.yaml'
            terraform:
              - 'terraform/**'
            scripts:
              - '**/*.sh'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
  lint:
    needs: detect
    if: github.event_name == 'pull_request' || inputs.job == 'all' || inputs.job == 'lint'
    runs-on: ubuntu-latest
    env:
      SKIP: terraform_fmt
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1
  resources:
    needs: detect
    if: |
      (github.event_name == 'pull_request' && needs.detect.outputs.resources == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'resources'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: ./.github/actions/setup-tools
      - name: Render, diff (main vs PR) and validate
        id: render
        run: |
          set +e
          set -uo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse origin/main 2>/dev/null || echo '')"
          worktree=""
          if [ -n "$base" ]; then
            worktree="../base"
            git worktree add -q --detach "$worktree" "$base" 2>/dev/null || worktree=""
          fi

          : > diff.md
          echo "## render-resources" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for chart in gitops/config/*/resources gitops/bootstrap/*/resources; do
            [ -f "$chart/Chart.yaml" ] || continue
            name="$(basename "$(dirname "$chart")")"
            echo "::group::$chart"
            if ! helm template "$chart" -f gitops/global-values.yaml > "new_res_$name.yaml" 2>/dev/null; then
              echo "- FAIL \`$chart\` (render error)" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif kubeconform -strict -ignore-missing-schemas -summary - < "new_res_$name.yaml"; then
              echo "- PASS \`$chart\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- FAIL \`$chart\`" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"

            if [ -n "$worktree" ] && [ -f "$worktree/$chart/Chart.yaml" ]; then
              helm template "$worktree/$chart" -f "$worktree/gitops/global-values.yaml" > "old_res_$name.yaml" 2>/dev/null
              delta="$(dyff between --omit-header --no-table-style \
                "old_res_$name.yaml" "new_res_$name.yaml" 2>/dev/null)"
              if [ -n "$delta" ]; then
                {
                  echo "<details><summary><b>$name</b> resources</summary>"
                  echo
                  echo '```'
                  echo "$delta" | head -n 300
                  echo '```'
                  echo "</details>"
                  echo
                } >> diff.md
              fi
            fi
          done

          if [ -n "$worktree" ]; then git worktree remove -f "$worktree" 2>/dev/null || true; fi

          {
            echo "### resources render diff"
            if [ -s diff.md ]; then cat diff.md; else echo "_No render changes._"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "fail=$fail" >> "$GITHUB_OUTPUT"
      - name: Upsert PR comment with resources render diff
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = fs.existsSync('diff.md') ? fs.readFileSync('diff.md', 'utf8') : '';
            const marker = '<!-- render-resources-diff -->';
            body = body.trim()
              ? `${marker}\n## Resources render diff (main → this PR)\n\n${body}`
              : `${marker}\n## Resources render diff (main → this PR)\n\n_No render changes from this PR._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail if validation failed
        if: steps.render.outputs.fail == '1'
        run: exit 1
  charts:
    needs: detect
    if: |
      (github.event_name == 'pull_request' && needs.detect.outputs.upstream == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'charts'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: ./.github/actions/setup-tools
      - name: Render, diff (main vs PR) and validate
        id: render
        run: |
          set +e
          set -uo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse origin/main 2>/dev/null || echo '')"
          worktree=""
          if [ -n "$base" ]; then
            worktree="../base"
            git worktree add -q --detach "$worktree" "$base" 2>/dev/null || worktree=""
          fi

          # Renders every chart source of an app (an app may have several, each
          # with its own valueFiles) and concatenates the output. $1=root dir,
          # $2=app name. Returns non-zero if any source fails to render.
          render_side() {
            local root="$1"
            local name="$2"
            local app="$root/gitops/apps/$name.yaml"
            [ -f "$app" ] || return 0
            local count i repo chart version release rc=0
            count="$(yq '[.spec.sources[] | select(.chart != null)] | length' "$app")"
            for i in $(seq 0 $((count - 1))); do
              repo="$(yq "[.spec.sources[] | select(.chart != null)] | .[${i}] | .repoURL" "$app")"
              chart="$(yq "[.spec.sources[] | select(.chart != null)] | .[${i}] | .chart" "$app")"
              version="$(yq "[.spec.sources[] | select(.chart != null)] | .[${i}] | .targetRevision" "$app")"
              release="$(yq "[.spec.sources[] | select(.chart != null)] | .[${i}] | .helm.releaseName // .chart" "$app")"
              local args=(template "$release" "$chart" --repo "$repo" --version "$version" --skip-tests)
              local vf
              while IFS= read -r vf; do
                [ -n "$vf" ] || continue
                vf="${vf#\$values/}"
                [ -f "$root/$vf" ] && args+=(-f "$root/$vf")
              done < <(yq "[.spec.sources[] | select(.chart != null)] | .[${i}] | .helm.valueFiles[]?" "$app")
              helm "${args[@]}" 2>/dev/null || rc=1
              echo "---"
            done
            return $rc
          }

          # Drops the Helm-injected version metadata labels that change on every
          # chart bump (helm.sh/chart, app.kubernetes.io/version, chart) so the
          # diff only surfaces real, behavioural changes.
          strip_version_labels() {
            sed -E '/^[[:space:]]*(helm\.sh\/chart|app\.kubernetes\.io\/version|chart):[[:space:]]/d'
          }

          : > diff.md
          fail=0
          for app in gitops/apps/*.yaml; do
            name="$(basename "$app" .yaml)"
            chart="$(yq '[.spec.sources[] | select(.chart != null) | .chart] | join(",")' "$app")"
            if [ -z "$chart" ] || [ "$chart" = "null" ]; then continue; fi
            newver="$(yq '[.spec.sources[] | select(.chart != null) | .targetRevision] | join(",")' "$app")"

            echo "::group::validate $name ($chart $newver)"
            if ! render_side "." "$name" > "new_$name.yaml"; then
              echo "helm template failed for $name"
              fail=1
            elif ! kubeconform -strict -ignore-missing-schemas -summary - < "new_$name.yaml"; then
              fail=1
            fi
            echo "::endgroup::"

            if [ -n "$worktree" ]; then
              render_side "$worktree" "$name" > "old_$name.yaml"
              strip_version_labels < "old_$name.yaml" > "old_${name}.stripped.yaml"
              strip_version_labels < "new_$name.yaml" > "new_${name}.stripped.yaml"
              delta="$(dyff between --omit-header --no-table-style \
                "old_${name}.stripped.yaml" "new_${name}.stripped.yaml" 2>/dev/null)"
              if [ -n "$delta" ]; then
                oldver="$(yq '[.spec.sources[] | select(.chart != null) | .targetRevision] | join(",")' "$worktree/gitops/apps/$name.yaml" 2>/dev/null || echo '?')"
                {
                  echo "<details><summary><b>$name</b> — $chart <code>$oldver</code> → <code>$newver</code></summary>"
                  echo
                  echo '```'
                  echo "$delta" | head -n 300
                  echo '```'
                  echo "</details>"
                  echo
                } >> diff.md
              fi
            fi
          done

          if [ -n "$worktree" ]; then git worktree remove -f "$worktree" 2>/dev/null || true; fi

          {
            echo "## render-upstream"
            if [ -s diff.md ]; then cat diff.md; else echo "_No render changes._"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "fail=$fail" >> "$GITHUB_OUTPUT"
      - name: Upsert PR comment with render diff
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = fs.existsSync('diff.md') ? fs.readFileSync('diff.md', 'utf8') : '';
            const marker = '<!-- render-diff -->';
            body = body.trim()
              ? `${marker}\n## Helm render diff (main → this PR)\n\n${body}`
              : `${marker}\n## Helm render diff (main → this PR)\n\n_No render changes from this PR._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail if validation failed
        if: steps.render.outputs.fail == '1'
        run: exit 1
  terraform:
    needs: detect
    if: |
      (github.event_name == 'pull_request' && needs.detect.outputs.terraform == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'terraform'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format check
        id: fmt
        run: terraform fmt -check -recursive terraform/
        continue-on-error: true
      - name: Init (no backend)
        run: terraform -chdir=terraform init -backend=false
      - name: Validate
        id: validate
        run: terraform -chdir=terraform validate
      - name: Summary
        if: always()
        run: |
          {
            echo "## terraform"
            echo "- fmt: ${{ steps.fmt.outcome }}"
            echo "- validate: ${{ steps.validate.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on fmt
        if: steps.fmt.outcome == 'failure'
        run: exit 1
  scripts:
    needs: detect
    if: |
      (github.event_name == 'pull_request' && needs.detect.outputs.scripts == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'scripts'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(scripts/*.sh terraform/files/*.sh)
          echo "## shellcheck" >> "$GITHUB_STEP_SUMMARY"
          if [ ${#files[@]} -eq 0 ]; then
            echo "_No shell scripts._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "${files[@]/#/- }" >> "$GITHUB_STEP_SUMMARY"
          shellcheck "${files[@]}"
  actionlint:
    needs: detect
    if: |
      (github.event_name == 'pull_request' && needs.detect.outputs.workflows == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'actionlint'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: |
          curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          tar xf actionlint.tar.gz actionlint
          ./actionlint -color
