name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: Which validation to run
        type: choice
        default: all
        options:
          - all
          - lint
          - terraform
          - scripts
          - workflows
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gitops: ${{ steps.filter.outputs.gitops }}
      terraform: ${{ steps.filter.outputs.terraform }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            gitops:
              - 'gitops/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'terraform/**'
            scripts:
              - '**/*.sh'
            workflows:
              - '.github/workflows/**'
  lint:
    needs: changes
    if: github.event_name == 'pull_request' || inputs.job == 'all' || inputs.job == 'lint'
    runs-on: ubuntu-latest
    env:
      SKIP: terraform_fmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  diff:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull-request
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: main
      - name: Render the Argo CD diff
        env:
          TARGET_BRANCH: refs/pull/${{ github.event.number }}/merge
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          TIMEOUT: "600"
          MAX_DIFF_LENGTH: "60000"
          DIFF_IGNORE: helm.sh/chart|app.kubernetes.io/version
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/main:/base-branch" \
            -v "$PWD/pull-request:/target-branch" \
            -v "$PWD/output:/output" \
            -e TARGET_BRANCH -e BASE_BRANCH -e REPO -e TIMEOUT -e MAX_DIFF_LENGTH -e DIFF_IGNORE \
            dagandersen/argocd-diff-preview:v0.2.16@sha256:21e7c8fa794220118feedc6e5316afd90cf0a107bfc845e08aa0291996efd968
      - name: Upsert PR comment with the Argo CD diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- argocd-diff-preview -->';
            const diff = fs.readFileSync('output/diff.md', 'utf8');
            const body = `${marker}\n${diff}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
  deadvalues:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: guarnz/deadvalues@eac40e4919709b2450e1f7eae5d60d401a278fb5 # v0.1.7
        with:
          path: gitops/apps
  terraform:
    needs: changes
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.terraform == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'terraform'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: Format check
        id: fmt
        run: terraform fmt -check -recursive terraform/
        continue-on-error: true
      - name: Init (no backend)
        run: terraform -chdir=terraform init -backend=false
      - name: Validate
        id: validate
        run: terraform -chdir=terraform validate
      - name: Summary
        if: always()
        run: |
          {
            echo "## terraform"
            echo "- fmt: ${{ steps.fmt.outcome }}"
            echo "- validate: ${{ steps.validate.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on fmt
        if: steps.fmt.outcome == 'failure'
        run: exit 1
  scripts:
    needs: changes
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.scripts == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'scripts'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(scripts/*.sh terraform/files/*.sh)
          echo "## shellcheck" >> "$GITHUB_STEP_SUMMARY"
          if [ ${#files[@]} -eq 0 ]; then
            echo "_No shell scripts._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "${files[@]/#/- }" >> "$GITHUB_STEP_SUMMARY"
          shellcheck "${files[@]}"
  workflows:
    needs: changes
    if: |
      (github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'workflows'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          curl -sSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          tar xf actionlint.tar.gz actionlint
          ./actionlint -color
