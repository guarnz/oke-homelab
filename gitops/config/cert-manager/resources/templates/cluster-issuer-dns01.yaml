{{- if eq (include "cert-manager-resources.challenge" .) "dns" }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ include "cert-manager-resources.email" . }}
    privateKeySecretRef:
      name: letsencrypt-dns01-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: certmanager-credentials
              key: token
{{- end }}
