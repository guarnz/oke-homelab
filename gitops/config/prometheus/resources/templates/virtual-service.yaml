apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - {{ include "prometheus-resources.host" . }}
  gateways:
    - monitoring
  http:
    - route:
        - destination:
            host: prometheus-grafana
            port:
              number: 80
