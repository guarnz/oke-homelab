apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: actualbudget
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - {{ include "actualbudget-resources.host" . }}
  gateways:
    - actualbudget
  http:
    - route:
        - destination:
            host: actualbudget
            port:
              number: 5006
