apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vaultwarden-tls
  namespace: istio-system
spec:
  secretName: vaultwarden-tls
  issuerRef:
    name: {{ include "vaultwarden-resources.issuer" . }}
    kind: ClusterIssuer
  dnsNames:
    - {{ include "vaultwarden-resources.host" . }}
