apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - {{ include "argocd-resources.host" . }}
  gateways:
    - argocd
  http:
    - route:
        - destination:
            host: argocd-server
            port:
              number: 80
